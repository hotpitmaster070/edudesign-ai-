<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduDesign.ai — Глобальный ИИ-Ментор для дизайнеров</title>
    <!-- Официальный скрипт Supabase для связи с базой данных -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0B0A12;
            color: #FFFFFF;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #A855F7, #6366F1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        .lang-switcher {
            display: flex;
            gap: 8px;
            margin-right: 15px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9CA3AF;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: #A855F7;
            color: white;
            border-color: #A855F7;
        }

        .badge-location {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid #A855F7;
            color: #D8B4FE;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
            min-height: 70vh;
        }

        .tagline {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9CA3AF;
        }

        h1 {
            font-size: 38px;
            font-weight: 800;
            line-height: 1.2;
            max-width: 800px;
            margin-bottom: 20px;
        }

        h1 span {
            background: linear-gradient(135deg, #C084FC, #818CF8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 16px;
            color: #9CA3AF;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .cta-btn {
            background: linear-gradient(135deg, #8B5CF6, #6366F1);
            color: white;
            border: none;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.5);
        }

        .upload-zone {
            margin-top: 50px;
            width: 100%;
            max-width: 500px;
            height: 180px;
            border: 2px dashed rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(168, 85, 247, 0.02);
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
        }

        .upload-zone:hover {
            background: rgba(168, 85, 247, 0.05);
            border-color: #A855F7;
        }

        .upload-icon { font-size: 36px; margin-bottom: 10px; }
        .upload-text { color: #A7F3D0; font-size: 14px; font-weight: 600; }
        .upload-subtext { color: #6B7280; font-size: 12px; margin-top: 5px; }

        .features-section {
            padding: 60px 8%;
            background: #0E0D18;
            text-align: center;
        }

        .features-section h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #FFF, #9CA3AF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid-features { display: flex; flex-direction: column; gap: 24px; }

        .feature-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px 24px;
            border-radius: 16px;
            text-align: left;
        }

        .step-num {
            font-size: 14px;
            font-weight: 700;
            color: #A855F7;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .feature-card h3 { font-size: 20px; margin-bottom: 10px; }
        .feature-card p { font-size: 15px; color: #9CA3AF; line-height: 1.5; }

        .earn-section {
            padding: 60px 8%;
            background: #0B0A12;
            text-align: center;
        }

        .earn-section h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #FFF, #9CA3AF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .earn-section .descr {
            color: #9CA3AF;
            font-size: 15px;
            max-width: 600px;
            margin: 0 auto 40px auto;
            line-height: 1.6;
        }

        .orders-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .order-card {
            background: rgba(168, 85, 247, 0.03);
            border: 1px solid rgba(168, 85, 247, 0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-info h4 { font-size: 18px; color: #FFFFFF; margin-bottom: 5px; }
        .order-info p { font-size: 14px; color: #9CA3AF; }
        .price-tag { font-size: 20px; font-weight: 800; color: #A7F3D0; margin-bottom: 5px; }
        
        .take-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        footer {
            padding: 60px 8%;
            background: #0E0D18;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .footer-content h3 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #C084FC, #818CF8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .footer-content p { color: #9CA3AF; font-size: 15px; margin-bottom: 30px; }
        .waitlist-form { display: flex; flex-direction: column; gap: 12px; max-width: 400px; margin: 0 auto; }
        
        .waitlist-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .waitlist-input:focus { border-color: #A855F7; }

        .submit-btn {
            background: #FFFFFF;
            color: #0B0A12;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .copyright { margin-top: 40px; font-size: 12px; color: #4B5563; }

        @media (min-width: 768px) {
            h1 { font-size: 48px; }
            .grid-features { flex-direction: row; }
            .feature-card { flex: 1; }
            .waitlist-form { flex-direction: row; }
            .waitlist-input { flex: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">EduDesign.ai</div>
        <div class="header-right">
            <div class="lang-switcher">
                <button class="lang-btn" onclick="alert('Панель языков в разработке')">AZ</button>
                <button class="lang-btn active">RU</button>
                <button class="lang-btn" onclick="alert('Панель языков в разработке')">EN</button>
            </div>
            <div class="badge-location" id="user-city">📍 Определение...</div>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="tagline" id="dynamic-tagline">Глобальная платформа для будущих топ-дизайнеров</div>
            <h1>Создавай топовый дизайн. <br><span>Зарабатывай и учись с ИИ.</span></h1>
